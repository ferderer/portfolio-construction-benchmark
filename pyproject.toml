[project]
name = "portfolio-construction-benchmark"
version = "0.1.0"
description = "Empirical comparison of Markowitz, Black-Litterman, and rule-based portfolio construction"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vadim Ferderer" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "yfinance>=0.2",
    "pypfopt>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["jupyter", "ruff", "pytest"]

[tool.ruff]
line-length = 120
